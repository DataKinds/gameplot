{% extends 'base.html' %}

{% block title %}Log in{% endblock %}

{% block header %}
<h1>Log in you silly goose</h1>
{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('toplevel.login') }}">
    <div>
        <label for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="Enter your email here...">
    </div>

    <div>
        <label for="email">Password</label>
        <input type="text" name="password" id="password" placeholder="Enter your email here...">
    </div>

    <button type="submit">Log in</button>
</form>
{% endblock %}

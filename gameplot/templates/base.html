<!doctype html>
<title>{% block title %}{% endblock %} :3</title>
<nav>
    <h1>Gameplot</h1>
    <ul>
        <li><a href="{{ url_for('toplevel.index') }}">Home</a></li>
    </ul>
</nav>
<section class="content">
    <header>
        {% block header %}{% endblock %}
    </header>
    {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</section>
